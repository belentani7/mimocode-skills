name: Skills verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Install frontmatter test dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Run inventory and security regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify catalog CLI and expected count
        run: |
          python scripts/skill_catalog.py --list --json > /tmp/mimocode-catalog.json
          python -c "import json; assert len(json.load(open('/tmp/mimocode-catalog.json'))) == 35"
